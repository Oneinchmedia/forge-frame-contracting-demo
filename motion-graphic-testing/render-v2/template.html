<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>One Inch render v2</title>
<style>%%FONTS%%
html,body{margin:0;background:#0B0B0B;overflow:hidden} canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
%%BASE%%
</script>
%%MODULES%%
<script>
// ---------- render API ----------
LOGO.src = '%%LOGO%%'; TAG.src = '%%TAG%%';
const imgReady = img => new Promise(res => { if (img.complete && img.naturalWidth) return res(); img.onload = () => res(); img.onerror = () => res(); });
window.readyPromise = Promise.all([
  document.fonts.load('700 100px Montserrat'), document.fonts.load('600 100px Montserrat'), document.fonts.load('500 100px Montserrat'),
  document.fonts.load('700 100px "Bodoni Moda"'), document.fonts.load('500 100px "IBM Plex Mono"'), document.fonts.ready, imgReady(LOGO), imgReady(TAG)
]).then(() => ({ fonts: document.fonts.size, logo: LOGO.naturalWidth, tag: TAG.naturalWidth }));
window.FPS = 30; window.DURATION = CUTS.full[CUTS.full.length - 1].t1;
window.drawAt = function (t) {
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = C.screen; ctx.fillRect(0, 0, W, H);
  const FR = CUTS.full; let f = FR[FR.length - 1]; for (const x of FR) { if (t < x.t1) { f = x; break; } }
  const p = Math.min(1, Math.max(0, (t - f.t0) / (f.t1 - f.t0)));
  const t0 = performance.now(); ctx.save(); f.draw(ctx, p, W, H); ctx.restore(); return performance.now() - t0;
};
window.drawFrameP = function (n, p) {
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = C.screen; ctx.fillRect(0, 0, W, H);
  const t0 = performance.now(); ctx.save(); DRAW[n](ctx, p, W, H); ctx.restore(); return performance.now() - t0;
};
window.renderFrame = function (t) { window.drawAt(t); return document.getElementById('c').toDataURL('image/png'); };
window.renderBatch = ts => ts.map(window.renderFrame);
window.renderFrameP = function (n, p) { const ms = window.drawFrameP(n, p); return { png: document.getElementById('c').toDataURL('image/png'), ms }; };
</script></body></html>
